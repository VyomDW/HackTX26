services:
  - type: web
    name: nodepad
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: MUSE_MODEL
        value: muse-spark-1.3
      - key: MUSE_FALLBACK_MODELS
        value: muse-spark-1.1,muse-wonder-1.0,muse-spark-1.3-contributor,muse-spark-1.2,muse-spark-1.2-contributor
      - key: MODEL_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: MESHY_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
