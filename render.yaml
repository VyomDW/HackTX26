services:
  - type: web
    name: nodepad
    runtime: node
    # Starter, not free: free services have no persistent disk, so accounts and files reset on every deploy or idle spin-down.
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /health
    autoDeployTrigger: commit
    # The server runs in server/, so data/ (accounts, rooms, images, media) lands here.
    disk:
      name: nodepad-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: MUSE_MODEL
        value: muse-spark-1.3-contributor
      - key: MUSE_FALLBACK_MODELS
        value: muse-spark-1.3-contributor,muse-spark-1.3,muse-spark-1.2-contributor,muse-spark-1.2,muse-spark-1.1,muse-wonder-1.0
      - key: MODEL_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: MESHY_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
